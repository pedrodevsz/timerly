services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: controle_estudos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - controle_estudos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controle_estudos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  controle_estudos_data:
